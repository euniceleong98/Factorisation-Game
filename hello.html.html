<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knight vs Dragon: Factorisation Quest</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --knight-color: #2ecc71;
            --dragon-color: #e74c3c;
            --dark: #2c3e50;
            --gold: #f1c40f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background-color: #111;
            padding: 20px;
            border-right: 4px solid #444;
            display: flex;
            flex-direction: column;
        }

        .stat-box {
            margin-bottom: 20px;
            padding: 10px;
            border: 2px solid #444;
            background: #222;
        }

        /* Battle Arena */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            align-items: center;
            overflow-y: auto;
        }

        #arena {
            width: 100%;
            max-width: 800px;
            height: 250px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            background: linear-gradient(to bottom, #1e272e, #000);
            border: 4px solid #333;
            border-radius: 10px;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }

        .fighter { text-align: center; width: 150px; }
        .fighter-icon { font-size: 60px; display: block; margin-bottom: 10px; }

        .hp-container {
            width: 100%;
            height: 15px;
            background: #444;
            border: 1px solid white;
            margin-top: 5px;
        }

        .hp-bar { height: 100%; width: 100%; transition: width 0.4s ease; }
        #knight-hp { background-color: var(--knight-color); }
        #dragon-hp { background-color: var(--dragon-color); }

        /* UI Box */
        #ui-layer {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            min-height: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .question-text { font-size: 1.4rem; margin-bottom: 20px; font-weight: bold; text-align: center; color: #2c3e50; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            border: 2px solid #ddd;
            background: #f9f9f9;
            border-radius: 8px;
            transition: 0.2s;
        }

        button:hover:not(:disabled) { background: #eef6ff; border-color: var(--primary); }

        /* Attack Menu Styles */
        #action-menu {
            text-align: center;
            display: none; /* Controlled by JS */
        }

        .attack-btn {
            background: var(--dragon-color);
            color: white;
            font-weight: bold;
            border: none;
            margin: 10px;
            padding: 20px 40px;
            font-size: 1.2rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hidden { display: none !important; }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #battle-msg {
            text-align: center;
            font-style: italic;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2 style="color: var(--gold)">QUEST LOG</h2>
        <div class="stat-box">
            Dragon HP: <span id="dragon-hp-text">120</span> / 120<br>
            Kills: <span id="kill-count">0</span>
        </div>
        <div id="history-list" style="font-size: 0.8rem; color: #888;"></div>
    </div>

    <div id="main-content">
        <div id="arena">
            <div id="knight-sprite" class="fighter">
                <span class="fighter-icon">🛡️⚔️</span>
                <div style="font-weight:bold">KNIGHT</div>
                <div class="hp-container"><div id="knight-hp" class="hp-bar"></div></div>
            </div>

            <div id="dragon-sprite" class="fighter">
                <span class="fighter-icon">🐲</span>
                <div style="font-weight:bold">DRAGON</div>
                <div class="hp-container"><div id="dragon-hp" class="hp-bar"></div></div>
            </div>
        </div>

        <div id="ui-layer">
            <!-- Phase 1: Question -->
            <div id="quiz-view">
                <div id="timer-label" style="text-align:right; color:#999; font-size:0.8rem"></div>
                <div class="question-text" id="question">Loading Question...</div>
                <div class="options-grid" id="options"></div>
            </div>

            <!-- Phase 2: Attack Choice -->
            <div id="action-menu">
                <h2 style="color: var(--knight-color)">CORRECT! ANSWERED FAST!</h2>
                <p>Choose your finishing move:</p>
                <button class="attack-btn" onclick="performAttack('Sword Slash')">SWORD SLASH ⚔️</button>
                <button class="attack-btn" onclick="performAttack('Karate Kick')" style="background:#8e44ad">KARATE KICK 🥋</button>
            </div>

            <!-- Phase 3: Feedback/Next -->
            <div id="feedback-view" class="hidden">
                <div id="feedback-text" style="text-align:center; font-size: 1.2rem; margin: 20px 0;"></div>
                <div style="text-align:center">
                    <button id="next-btn" onclick="nextRound()" style="background:var(--dark); color:white; padding: 10px 40px;">Continue Quest</button>
                </div>
            </div>
            
            <div id="battle-msg">Factorise correctly to attack!</div>
        </div>
    </div>

    <script>
        const dragonMaxHP = 120;
        let dragonHP = 120;
        let knightHP = 100;
        let startTime = 0;
        let damageToDeal = 0;

        const questions = [
            { q: "x² - 16", a: ["(x-4)(x+4)", "(x-4)²", "(x-8)(x+2)", "(x+16)(x-1)"], c: 0 },
            { q: "x² + 5x + 6", a: ["(x+1)(x+6)", "(x+2)(x+3)", "(x+5)(x+1)", "(x-2)(x-3)"], c: 1 },
            { q: "x² - 25", a: ["(x-5)²", "(x+25)(x-1)", "(x-5)(x+5)", "(x+5)²"], c: 2 },
            { q: "2x + 10", a: ["2(x+5)", "2(x+10)", "x(2+10)", "5(x+2)"], c: 0 },
            { q: "x² - 9", a: ["(x-3)²", "(x-3)(x+3)", "(x+9)(x-1)", "3(x-3)"], c: 1 },
            { q: "x² + 8x + 16", a: ["(x+8)²", "(x+4)(x+2)", "(x+4)²", "(x+16)(x+1)"], c: 2 },
            { q: "x² - 1", a: ["(x-1)²", "(x-1)(x+1)", "x(x-1)", "(x+1)²"], c: 1 },
            { q: "3x² - 3", a: ["3(x-1)(x+1)", "3(x-1)²", "(3x-1)(x+1)", "3x(x-1)"], c: 0 }
        ];

        function playBling() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
            g.gain.setValueAtTime(0.1, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(); osc.stop(ctx.currentTime + 0.3);
        }

        function loadQuestion() {
            // Reset Views
            document.getElementById('quiz-view').style.display = 'block';
            document.getElementById('action-menu').style.display = 'none';
            document.getElementById('feedback-view').classList.add('hidden');
            
            const qData = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('question').innerText = "Factorise: " + qData.q;
            
            const optContainer = document.getElementById('options');
            optContainer.innerHTML = '';
            
            qData.a.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, qData.c);
                optContainer.appendChild(btn);
            });
            
            startTime = Date.now();
        }

        function checkAnswer(selected, correct) {
            const timeTaken = (Date.now() - startTime) / 1000;
            
            if (selected === correct) {
                playBling();
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 } });
                
                // Calculate damage: faster = more damage (max 20, min 10)
                damageToDeal = Math.max(10, Math.floor(22 - timeTaken));
                
                // SWITCH TO ATTACK MENU
                document.getElementById('quiz-view').style.display = 'none';
                document.getElementById('action-menu').style.display = 'block';
                document.getElementById('battle-msg').innerText = "Select a weapon!";
            } else {
                // Dragon Attacks
                knightHP -= 20;
                updateBars();
                document.getElementById('knight-sprite').classList.add('shake');
                setTimeout(() => document.getElementById('knight-sprite').classList.remove('shake'), 500);
                
                showFeedback("Ouch! The dragon scorched you for 20 damage! Keep trying!", "red");
                addLog("Wrong answer - Dragon attacked!");
            }
        }

        function performAttack(weapon) {
            dragonHP -= damageToDeal;
            updateBars();
            
            // Visual feedback on Dragon
            document.getElementById('dragon-sprite').classList.add('shake');
            setTimeout(() => document.getElementById('dragon-sprite').classList.remove('shake'), 500);

            showFeedback(`You used ${weapon}! Dealt ${damageToDeal} damage!`, "green");
            addLog(`Correct! Hit Dragon for ${damageToDeal}`);
            
            if (dragonHP <= 0) {
                victory();
            }
        }

        function showFeedback(text, color) {
            document.getElementById('action-menu').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'none';
            const fv = document.getElementById('feedback-view');
            fv.classList.remove('hidden');
            const ft = document.getElementById('feedback-text');
            ft.innerText = text;
            ft.style.color = color;
        }

        function updateBars() {
            document.getElementById('dragon-hp').style.width = Math.max(0, (dragonHP/dragonMaxHP)*100) + "%";
            document.getElementById('dragon-hp-text').innerText = Math.max(0, dragonHP);
            document.getElementById('knight-hp').style.width = Math.max(0, knightHP) + "%";
            
            if (knightHP <= 0) {
                document.getElementById('ui-layer').innerHTML = "<h1 style='text-align:center'>GAME OVER</h1><p style='text-align:center'>The Dragon defeated you. Refresh to try again.</p>";
            }
        }

        function nextRound() {
            if (dragonHP > 0) loadQuestion();
        }

        function addLog(msg) {
            const list = document.getElementById('history-list');
            list.innerHTML = `<div>• ${msg}</div>` + list.innerHTML;
        }

        function victory() {
            confetti({ particleCount: 300, spread: 150 });
            document.getElementById('ui-layer').innerHTML = "<h1 style='text-align:center; color:green'>🏆 VICTORY!</h1><p style='text-align:center'>You defeated the Dragon with the power of Factorisation!</p><button onclick='location.reload()' style='display:block; margin:auto'>Play Again</button>";
            document.getElementById('kill-count').innerText = "1";
        }

        loadQuestion();
    </script>
</body>
</html>
