<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorisation Master Game</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #f5f7fa;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--secondary);
        }

        /* Left Sidebar - Summary */
        #sidebar {
            width: 250px;
            background-color: var(--dark);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        #sidebar h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        
        .stat-box {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            text-align: center;
        }

        .stat-count { font-size: 2rem; font-weight: bold; }
        .correct { color: var(--success); }
        .wrong { color: var(--danger); }

        /* Main Content */
        #main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        #game-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .question-text {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--dark);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button.option-btn {
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid var(--primary);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.option-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Feedback Styles */
        #feedback {
            margin-top: 20px;
            font-weight: bold;
            min-height: 50px;
        }

        .correct-feedback { color: var(--success); animation: bounce 0.5s; }
        .wrong-feedback { color: var(--danger); }
        .answer-reveal { display: block; font-size: 0.9rem; color: #666; margin-top: 5px; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Progress</h2>
        <div class="stat-box">
            <div>Correct</div>
            <div id="correct-count" class="stat-count correct">0</div>
        </div>
        <div class="stat-box">
            <div>Incorrect</div>
            <div id="wrong-count" class="stat-count wrong">0</div>
        </div>
        <div id="history">
            <h3>Log</h3>
            <ul id="history-list" style="font-size: 0.8rem; padding-left: 20px;"></ul>
        </div>
    </div>

    <div id="main-content">
        <div id="game-container">
            <div id="quiz-view">
                <div id="progress-text" style="color: #999; margin-bottom: 10px;">Question 1 of 5</div>
                <div class="question-text" id="question">Loading...</div>
                <div class="options-grid" id="options"></div>
                <div id="feedback"></div>
                <button id="next-btn" class="hidden" style="margin-top:20px; padding: 10px 20px; background: var(--dark); color: white; border: none; border-radius: 5px; cursor: pointer;">Next Question</button>
            </div>

            <div id="result-view" class="hidden">
                <h1>Game Over!</h1>
                <p id="final-score"></p>
                <button onclick="location.reload()" style="padding: 15px 30px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Factorise: x² - 16",
                options: ["(x - 4)(x - 4)", "(x + 4)(x - 4)", "(x + 8)(x - 2)", "(x + 16)(x - 1)"],
                correct: 1,
                explanation: "This is a difference of squares: a² - b² = (a - b)(a + b)"
            },
            {
                q: "Factorise: x² + 5x + 6",
                options: ["(x + 5)(x + 1)", "(x + 6)(x + 1)", "(x + 2)(x + 3)", "(x - 2)(x - 3)"],
                correct: 2,
                explanation: "We need two numbers that multiply to 6 and add to 5 (2 and 3)."
            },
            {
                q: "Factorise: 12a + 36",
                options: ["12(a + 3)", "6(2a + 30)", "12(a + 36)", "a(12 + 36)"],
                correct: 0,
                explanation: "The Greatest Common Factor (GCF) is 12."
            },
            {
                q: "Factorise: x² - 10x + 25",
                options: ["(x - 5)(x + 5)", "(x - 10)(x - 2.5)", "(x - 5)²", "(x + 5)²"],
                correct: 2,
                explanation: "This is a perfect square trinomial: (a - b)² = a² - 2ab + b²"
            },
            {
                q: "Factorise: 2x² + 5x + 3",
                options: ["(2x + 1)(x + 3)", "(2x + 3)(x + 1)", "(2x + 5)(x + 1)", "(x + 2)(x + 3)"],
                correct: 1,
                explanation: "Split the middle: 2x² + 2x + 3x + 3 = 2x(x + 1) + 3(x + 1) = (2x + 3)(x + 1)"
            }
        ];

        let currentQ = 0;
        let score = 0;
        let wrong = 0;

        // Sound Synthesis (Bling Bling)
        function playBling() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const playNote = (delay, pitch) => {
                const osc = context.createOscillator();
                const gain = context.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(pitch, context.currentTime + delay);
                gain.gain.setValueAtTime(0.1, context.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + delay + 0.5);
                osc.connect(gain);
                gain.connect(context.destination);
                osc.start(context.currentTime + delay);
                osc.stop(context.currentTime + delay + 0.5);
            };
            playNote(0, 880);      // High A
            playNote(0.1, 1320);   // E6 (Bling!)
        }

        function loadQuestion() {
            const qData = questions[currentQ];
            document.getElementById('progress-text').innerText = `Question ${currentQ + 1} of 5`;
            document.getElementById('question').innerText = qData.q;
            const optionsEl = document.getElementById('options');
            optionsEl.innerHTML = '';
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('next-btn').classList.add('hidden');

            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsEl.appendChild(btn);
            });
        }

        function checkAnswer(idx) {
            const qData = questions[currentQ];
            const feedbackEl = document.getElementById('feedback');
            const historyList = document.getElementById('history-list');
            const li = document.createElement('li');

            // Disable all buttons
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

            if (idx === qData.correct) {
                score++;
                document.getElementById('correct-count').innerText = score;
                feedbackEl.innerHTML = `<span class="correct-feedback">✨ Brilliant! That's correct! ✨</span>`;
                li.innerHTML = `<span class="correct">Q${currentQ+1} Correct</span>`;
                
                // Visual & Audio celebration
                playBling();
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                wrong++;
                document.getElementById('wrong-count').innerText = wrong;
                feedbackEl.innerHTML = `
                    <span class="wrong-feedback">Not quite! Keep going, you're learning!</span>
                    <span class="answer-reveal">Correct Answer: <b>${qData.options[qData.correct]}</b></span>
                    <i style="font-size: 0.8rem; display:block; color:#666;">${qData.explanation}</i>
                `;
                li.innerHTML = `<span class="wrong">Q${currentQ+1} Incorrect</span>`;
            }

            historyList.appendChild(li);
            document.getElementById('next-btn').classList.remove('hidden');
        }

        document.getElementById('next-btn').onclick = () => {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('final-score').innerText = `You scored ${score} out of 5!`;
            if (score === 5) confetti({ particleCount: 200, spread: 160 });
        }

        // Initialize game
        loadQuestion();
    </script>
</body>
</html>
